<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Custom PC Build Request</title>
</head>
<body>
  <h1>Custom PC Build Request</h1>
  <p>Fill out this form and our build team will spec out your dream PC.</p>
  <p><a href="index.html">Back to home</a></p>
 
  <!-- ==========================================================
       PART 1 (zyBooks 3.2 Forms)
       1. Add a <form> with action="https://httpbin.org/get" and target="_blank"
          (no method yet -- what is the default?)
       2. Inside it: labeled text boxes for first name (name/id "first")
          and last name (name/id "last"), each with a placeholder
       3. A <textarea> named "notes" with 5 rows and 50 cols
       4. An <input type="submit">
       5. Test it, read the URL. Then change to method="POST" and
          action="https://httpbin.org/post" and test again.
       ========================================================== -->
 
  <form action="#" method="GET">
      <fieldset>
         <legend>Your Info</legend>
   <p>
    <label for="first">First Name:</label>
    <input type="text" id="first" name="first" id="first" placeholder="Enter your first name" required><br>
    <!-- NOTE: Input elements are void elements - so they do not include a closing tag-->
    <label for="last">Last Name:</label>
    <input type="text" id="last" name="last" placeholder="Enter your last name" required><br>
    <label for="notes">Notes:</label>
    <textarea id="notes" name="notes" rows="5" cols="50"></textarea><br>
    <input type="submit">
   </p>
   <p>
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" placeholder="name@domain.com" required><br>
   </p>
   <p>
      <label for="phone">Phone:</label>
      <input type="tel" id="phone" name="phone" placeholder="123-555-7890"
      pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" title="Format: 123-555-7890"><br>
   </p>
   <p>
      <label for="tracker">Order tracking password (8-12 characters):</label>
      <input type="password" id="tracker" name="tracker" size="12" maxlength="12" minlength="8" required><br>
   </p>
      </fieldset>

      <fieldset>
         <legend>Processor (pick one)</legend>
         <div>
            <input type="radio" id="i5" name="cpu" value="i5" checked>
            <label for="i5">Intel Core i5</label><br>
         </div>   
         <div>
            <input type="radio" id="i7" name="cpu" value="i7">
            <label for="i7">Intel Core i7</label><br>
         </div>
         <div>
            <input type="radio" id="ryzen5" name="cpu" value="ryzen5">
            <label for="ryzen5">AMD Ryzen 5</label><br>
         </div>
         <div>
            <input type="radio" id="atom" name="cpu" value="atom">
            <label for="atom">Intel Atom</label><br>
         </div>
         <div>
            <input type="radio" id="ryzen7" name="cpu" value="ryzen7">
            <label for="ryzen7">AMD Ryzen 7</label><br>
         </div>  

         
            
         
            
      </fieldset>
 
   <!-- drop-down and list box-->
<fieldset>
         <legend>Software and Ports</legend>
         <p>
            <label for="os">Operating System:</label>
         <select id="os" name="os">
             <option value="windows11">Windows 11</option>
             <option value="Ubuntu">Linux (Ubuntu)</option>
             <option value="None">No OS</option>
         </select><br>
         <label for="ports">Ports needed (hold Ctrl or Command to pick more than one):</label>
         <select id="ports" name="ports" size="4" multiple>
             <option value="usbc">USB-C</option>
             <option value="hdmi">HDMI</option>
             <option value="ethernet">Ethernet</option>
             <option value="audio">Audio</option>
             <option value="displayport">DisplayPort</option>
             <option value="thunderbolt">Thunderbolt</option>
         </select><br>
         </p>
      </fieldset>
  </form>
 
  <!-- ==========================================================
       PART 2 (zyBooks 3.3 Common form widgets)  -- inside the form
       1. Wrap first/last name in <fieldset> with <legend>Your Info</legend>
       2. Add a password field (name/id "tracker", size 12, maxlength 12)
       3. Processor fieldset: 4 radio buttons, name="cpu"
          (i5, i7, ryzen5, ryzen7) -- make i5 checked
       4. Extras fieldset: checkboxes "wifi" (checked), "rgb", "extraSsd"
       5. A <select> drop-down "os": Windows 11, Linux (Ubuntu), No OS
       6. A list box "ports" with size="4" and multiple
       7. Replace the submit input with <button type="submit">
          and add <input type="button" value="Save for Later">
       ========================================================== -->
 
 
 
  <!-- ==========================================================
       PART 3 (zyBooks 3.4 Additional form widgets)  -- inside the form
       1. Email (type="email") and phone (type="tel") in Your Info
       2. Build Details fieldset:
            number  "budget"   min 500, max 3000, step 50
            range   "rgbLevel" min 0, max 100, step 10, value 50
            color   "caseColor"
            date    "neededBy" with a min and max date
            combo box: <input list="games"> + <datalist id="games">
            url     "portfolio"
       3. Validation: add required to first, last, email, tracker;
          minlength="8" on tracker; a pattern on phone
       4. Try to BREAK your form -- submit it empty, type bad data
       ========================================================== -->
 
</body>
</html>
